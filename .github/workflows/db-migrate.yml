name: Database migrate

# Creates the MatrixHub user/multitenant tables if they don't already exist.
#
# The migration runner (scripts/migrate.mjs) is idempotent — every statement is
# CREATE ... IF NOT EXISTS and each file is recorded in `schema_migrations`, so
# running this repeatedly is safe and only applies new migrations.
#
# Required repository secret:
#   DATABASE_URL  — Neon pooled connection string
#     (Settings → Secrets and variables → Actions → New repository secret)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
      - claude/cool-cannon-qh5OC
    paths:
      - 'migrations/**'
      - 'scripts/migrate.mjs'
      - '.github/workflows/db-migrate.yml'

# Never run two migrations against the same database concurrently.
concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "DATABASE_URL is configured."

      - name: Run migrations (create tables if not exists)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
